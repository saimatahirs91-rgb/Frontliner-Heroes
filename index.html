<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontliners Stories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .story-box {
            background-color: #dbeeff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #1a1a1a;
            margin-top: 0;
        }

        p {
            font-family: Verdana, sans-serif;
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 25px;
        }

        .contact-btn {
            background-color: lightblue
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px; 
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .contact-btn:hover {
            background-color: #9accdb;
            transform: scale(1.02);
        }
    </style>
</head>
<body>


    <div class="story-box">
        <h1>Frontliner Stories</h1>
        <p>Sorry! Right now we don't have any story. To add your own story with your name, kindly click the button below to contact us.</p>
                <a href="mailto:shayantahir1372@gmail.com">
            <button class="contact-btn">Contact Us To Add Your Story</button>
        </a>
    </div>

</body>
</html>
